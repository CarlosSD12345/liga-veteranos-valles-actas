<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acta | Liga Veteranos Vallès</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <header class="status-bar">
        <div class="status-left">19:51</div>
        <div class="status-right" aria-label="Estado del teléfono">
          <span>◔</span>
          <span>◍</span>
          <span>▣</span>
        </div>
      </header>

      <div class="browser-bar">
        <button class="icon-button" aria-label="Inicio">⌂</button>
        <div class="browser-address">intranet.fcf.cat/nfg/</div>
        <div class="browser-actions">
          <button class="icon-button" aria-label="Añadir">＋</button>
          <span class="browser-badge">26</span>
          <button class="icon-button" aria-label="Más opciones">⋮</button>
        </div>
      </div>

      <nav class="top-nav">
        <button class="back-button" type="button">← Tornar</button>
        <div class="brand-title">ACTES</div>
        <button class="summary-button" type="button">☰ Resum</button>
      </nav>

      <div class="tab-bar" role="tablist" aria-label="Tabs de l'acta">
        <button class="tab is-active" type="button" data-tab="informacio" role="tab" aria-selected="true">
          <span class="tab-icon">i</span>
          <span>Informació</span>
        </button>
        <button class="tab" type="button" data-tab="local" role="tab" aria-selected="false">
          <span class="tab-icon">◔</span>
          <span>Local</span>
        </button>
        <button class="tab" type="button" data-tab="visitant" role="tab" aria-selected="false">
          <span class="tab-icon">◔</span>
          <span>Visitant</span>
        </button>
        <button class="tab" type="button" data-tab="altres" role="tab" aria-selected="false">
          <span class="tab-icon">↓</span>
          <span>Altres dades</span>
        </button>
      </div>

      <main id="contentPane" class="content-pane" aria-live="polite"></main>

      <footer class="bottom-bar">
        <button type="button" class="bottom-action">
          <span class="bottom-icon">◔</span>
          <span>Guardar Dades</span>
        </button>
        <button type="button" class="bottom-action">
          <span class="bottom-icon">☰</span>
          <span>Imprimeix Acta</span>
        </button>
        <button type="button" class="bottom-action bottom-action--primary">
          <span class="bottom-icon">✓</span>
          <span>Finalitzar Acta</span>
        </button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>

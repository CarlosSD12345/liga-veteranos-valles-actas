<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acta de partido</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="topbar">
        <h1>Acta de partido</h1>
        <button id="guardarActa" class="btn-primary">Guardar acta</button>
      </header>

      <section class="card">
        <h2>Datos del encuentro</h2>
        <div class="grid two-columns">
          <label>
            Jornada
            <select id="jornadaSelect"></select>
          </label>
          <label>
            Partido
            <select id="partidoSelect"></select>
          </label>
          <label>
            Fecha
            <input id="fechaInput" type="date" />
          </label>
          <label>
            Árbitro
            <select id="arbitroSelect"></select>
          </label>
          <label>
            Campo
            <input id="campoInput" type="text" placeholder="Campo" />
          </label>
          <label>
            Hora
            <input id="horaInput" type="time" />
          </label>
        </div>

        <div class="grid score-grid">
          <div class="score-box">
            <h3 id="localEquipo">Local</h3>
            <input id="golesLocal" type="number" min="0" value="0" />
          </div>
          <div class="score-box">
            <h3 id="visitanteEquipo">Visitante</h3>
            <input id="golesVisitante" type="number" min="0" value="0" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Convocados</h2>
        <div class="grid two-columns">
          <div>
            <label>Local</label>
            <textarea id="convocadosLocal" rows="8" placeholder="Ejemplo: 1 - Uri&#10;7 - Abel"></textarea>
          </div>
          <div>
            <label>Visitante</label>
            <textarea id="convocadosVisitante" rows="8" placeholder="Ejemplo: 9 - Kaña&#10;10 - Javi"></textarea>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Incidencias</h2>
        <div id="incidenciasContainer"></div>
        <button id="addIncidencia" class="btn-secondary">Añadir incidencia</button>
      </section>

      <section class="card">
        <h2>Observaciones</h2>
        <textarea id="observaciones" rows="5" placeholder="Comentarios del árbitro"></textarea>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

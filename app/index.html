<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acta de partido | Liga Veteranos Vallès</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Liga Veteranos Vallès</p>
          <h1>Acta del partido</h1>
        </div>
        <button id="guardarActa" class="btn-primary">Guardar acta</button>
      </header>

      <section class="card">
        <h2>Datos del encuentro</h2>

        <div class="grid two-columns">
          <label>
            Jornada
            <select id="jornadaSelect"></select>
          </label>

          <label>
            Partido
            <select id="partidoSelect"></select>
          </label>

          <label>
            Fecha
            <input id="fechaInput" type="date" />
          </label>

          <label>
            Hora
            <input id="horaInput" type="time" />
          </label>

          <label>
            Campo
            <input id="campoInput" type="text" placeholder="Campo" />
          </label>

          <label>
            Árbitro
            <select id="arbitroSelect"></select>
          </label>
        </div>

        <div class="score-grid">
          <div class="score-box">
            <h3 id="localEquipo">Local</h3>
            <input id="golesLocal" type="number" min="0" value="0" />
          </div>

          <div class="score-box">
            <h3 id="visitanteEquipo">Visitante</h3>
            <input id="golesVisitante" type="number" min="0" value="0" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Convocados</h2>
        <div class="players-grid">
          <div class="team-panel">
            <h3 class="team-title">EQUIPO LOCAL</h3>
            <div class="section-label">JUGADORES TITULARES</div>
            <div id="convocadosLocal" class="player-table-container"></div>

            <div class="section-divider"></div>
            <div class="section-label">JUGADORES SUPLENTES</div>
            <button type="button" class="btn-secondary add-suplente-btn" data-team="local">Añadir suplente</button>
          </div>

          <div class="team-panel">
            <h3 class="team-title">EQUIPO VISITANTE</h3>
            <div class="section-label">JUGADORES TITULARES</div>
            <div id="convocadosVisitante" class="player-table-container"></div>

            <div class="section-divider"></div>
            <div class="section-label">JUGADORES SUPLENTES</div>
            <button type="button" class="btn-secondary add-suplente-btn" data-team="visitante">Añadir suplente</button>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Incidencias</h2>
        <div id="incidenciasContainer" class="incidencias-list"></div>
        <button id="addIncidencia" type="button" class="btn-secondary">Añadir incidencia</button>
      </section>

      <section class="card">
        <h2>Observaciones</h2>
        <textarea id="observaciones" rows="5" placeholder="Comentarios del árbitro..."></textarea>
      </section>

      <section class="card saved-actas-card">
        <h2>Actas guardadas</h2>
        <ul id="actasGuardadas" class="actas-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
